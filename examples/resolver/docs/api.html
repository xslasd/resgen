        function normalizeApiData(raw) {
            if (!raw) return raw;
            if (raw.modules && raw.modules.length > 0) return raw;

            const data = {
                info: raw.info || {},
                version: raw['x-resgen-version'] || raw.version || '',
                package: raw['x-resgen-package'] || raw.package || '',
                validators: raw['x-resgen-validators'] || raw.validators || [],
                scalars: raw['x-resgen-scalars'] || raw.scalars || {},
                modules: [],
                models: [],
                enums: [],
                unions: []
            };

            if (raw.components && raw.components.schemas) {
                Object.keys(raw.components.schemas).forEach(schemaName => {
                    const schema = raw.components.schemas[schemaName];
                    if (schema['x-res-enum-cases'] || schema.enum) {
                        data.enums.push({
                            name: schemaName,
                            baseType: schema.type === 'integer' ? 'Int' : 'String',
                            doc: schema.description || '',
                            sourceFile: schema['x-res-file'] || '',
                            cases: schema['x-res-enum-cases'] || (schema.enum || []).map(v => ({ name: String(v), value: v, isString: schema.type !== 'integer' }))
                        });
                    } else if (schema.type === 'object' || schema.properties) {
                        const fields = [];
                        if (schema.properties) {
                            Object.keys(schema.properties).forEach(propName => {
                                const prop = schema.properties[propName];
                                const isReq = schema.required && schema.required.includes(propName);
                                const validators = [];
                                if (isReq) validators.push({ name: 'Required' });

                                let propType = 'String';
                                if (prop['$ref']) {
                                    propType = prop['$ref'].replace('#/components/schemas/', '');
                                } else if (prop.type === 'array' && prop.items) {
                                    const itemType = prop.items['$ref'] ? prop.items['$ref'].replace('#/components/schemas/', '') : (prop.items.type || 'Any');
                                    propType = `[]${itemType}`;
                                } else if (prop.type) {
                                    propType = prop.type === 'integer' ? 'Int' : (prop.type.charAt(0).toUpperCase() + prop.type.slice(1));
                                }

                                fields.push({
                                    name: propName,
                                    jsonName: propName,
                                    type: propType,
                                    doc: prop.description || '',
                                    validators: validators,
                                    isPayload: !!prop['x-res-payload'],
                                    payloadArg: prop['x-res-payload'] || ''
                                });
                            });
                        }
                        data.models.push({
                            name: schemaName,
                            doc: schema.description || '',
                            sourceFile: schema['x-res-file'] || '',
                            fields: fields
                        });
                    }
                });
            }

            const moduleMap = {};
            if (raw.paths) {
                Object.keys(raw.paths).forEach(pathKey => {
                    const methods = raw.paths[pathKey];
                    Object.keys(methods).forEach(methodKey => {
                        const op = methods[methodKey];
                        const modName = op['x-res-module'] || (op.tags && op.tags[0]) || 'Default';
                        const grpName = op['x-res-group'] || '/';

                        if (!moduleMap[modName]) {
                            moduleMap[modName] = { name: modName, doc: '', groupsMap: {} };
                        }
                        const modObj = moduleMap[modName];

                        if (!modObj.groupsMap[grpName]) {
                            modObj.groupsMap[grpName] = { name: grpName, path: grpName, endpoints: [] };
                        }
                        const grpObj = modObj.groupsMap[grpName];

                        const dslPath = pathKey.replace(/\{([^}]+)\}/g, ':$1');

                        const args = [];
                        if (op.parameters) {
                            op.parameters.forEach(p => {
                                let argType = 'String';
                                if (p.schema) {
                                    if (p.schema['$ref']) argType = p.schema['$ref'].replace('#/components/schemas/', '');
                                    else if (p.schema.type) argType = p.schema.type === 'integer' ? 'Int' : (p.schema.type.charAt(0).toUpperCase() + p.schema.type.slice(1));
                                }
                                const validators = [];
                                if (p.required) validators.push({ name: 'Required' });
                                args.push({
                                    name: p.name,
                                    source: p.in ? (p.in.charAt(0).toUpperCase() + p.in.slice(1)) : 'Query',
                                    type: argType,
                                    doc: p.description || '',
                                    validators: validators
                                });
                            });
                        }

                        let reqContentType = op['x-res-content-type'] || '';
                        if (!reqContentType && op.requestBody && op.requestBody.content) {
                            const keys = Object.keys(op.requestBody.content);
                            if (keys.length > 0) {
                                const mime = keys[0];
                                if (mime.includes('multipart')) reqContentType = 'multipart';
                                else if (mime.includes('x-www-form-urlencoded')) reqContentType = 'form';
                                else if (mime.includes('json')) reqContentType = 'json';
                                else if (mime.includes('xml')) reqContentType = 'xml';
                                else reqContentType = mime;
                            }
                        }
                        if (!reqContentType && methodKey.toUpperCase() !== 'GET') {
                            reqContentType = 'json';
                        }

                        let respContentType = op['x-res-response-content-type'] || '';
                        if (!respContentType && op.responses) {
                            for (const code of ['200', '201', '204', 'default']) {
                                if (op.responses[code] && op.responses[code].content) {
                                    const keys = Object.keys(op.responses[code].content);
                                    if (keys.length > 0) {
                                        respContentType = keys[0];
                                        break;
                                    }
                                }
                            }
                        }
                        if (!respContentType) {
                            respContentType = 'application/json';
                        }

                        let errContentType = op['x-res-error-content-type'] || '';
                        if (!errContentType && op.responses && op.responses['default'] && op.responses['default'].content) {
                            const keys = Object.keys(op.responses['default'].content);
                            if (keys.length > 0) {
                                errContentType = keys[0];
                            }
                        }

                        const sealInfo = op['x-res-seal'] || {};

                        grpObj.endpoints.push({
                            name: op.summary || op.operationId,
                            method: methodKey.toUpperCase(),
                            fullPath: dslPath,
                            doc: op.description || '',
                            permission: op['x-res-permission'] || '',
                            sourceFile: op['x-res-file'] || '',
                            contentType: reqContentType,
                            responseContentType: respContentType,
                            errorContentType: errContentType,
                            isErrorWrapped: op['x-res-error-wrapped'] || false,
                            errorTypeBase: op['x-res-error-type'] || '',
                            args: args,
                            inputName: op['x-res-input-name'] || '',
                            inSealChain: sealInfo.inSealChain || [],
                            inSealGoType: sealInfo.inSealGoType || '',
                            innerInputName: sealInfo.innerInputName || '',
                            outSealChain: sealInfo.outSealChain || [],
                            outSealGoType: sealInfo.outSealGoType || '',
                            outPayloadDSL: sealInfo.outPayloadDSL || '',
                            returnTypeDSL: op['x-res-return-type-dsl'] || op['x-res-return-type'] || '',
                            returnTypeBase: op['x-res-return-type'] || ''
                        });
                    });
                });
            }

            Object.keys(moduleMap).forEach(mName => {
                const m = moduleMap[mName];
                const groups = Object.keys(m.groupsMap).map(gName => m.groupsMap[gName]);
                data.modules.push({
                    name: m.name,
                    doc: m.doc,
                    groups: groups
                });
            });

            return data;
        }

        function init() {
            renderSidebar();
            renderDashboardStats();
            
            document.getElementById('api-search').addEventListener('input', (e) => {
                renderSidebar(e.target.value);
            });
        }

        function renderDashboardStats() {
            if (!apiData) return;
            const modules = apiData.modules.length;
            const endpoints = apiData.modules.reduce((acc, m) => acc + m.groups.reduce((g_acc, g) => g_acc + g.endpoints.length, 0), 0);
            const models = apiData.models ? apiData.models.length : 0;
            
            const mEl = document.getElementById('stat-modules');
            const eEl = document.getElementById('stat-endpoints');
            const mdEl = document.getElementById('stat-models');
            
            if (mEl) mEl.innerText = modules;
            if (eEl) eEl.innerText = endpoints;
            if (mdEl) mdEl.innerText = models;
        }

        let toggledModules = new Set(apiData.modules.map(m => m.name));
        let activeEndpointId = null;
        let currentView = 'apis'; // 'apis', 'validators', 'enums'

        function renderSidebar(search = '') {
            const nav = document.getElementById('nav-content');
            nav.innerHTML = '';
            
            search = search.toLowerCase();

            // --- Primary Menu ---
            const menu = document.createElement('div');
            menu.className = 'space-y-1 mb-8';
            
            const createMenuItem = (id, label, icon, color, onClick) => {
                const isActive = currentView === id;
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-4 py-3 rounded-xl text-sm transition-all flex items-center gap-3 group font-bold tracking-tight ${isActive ? `bg-${color}-500/20 text-${color}-400 border border-${color}-500/30 ring-1 ring-${color}-500/20` : 'hover:bg-slate-800/50 text-slate-400'}`;
                btn.onclick = () => {
                    currentView = id;
                    onClick();
                    renderSidebar(search);
                };
                btn.innerHTML = `${icon} <span>${label}</span>`;
                return btn;
            };

            nav.appendChild(createMenuItem('validators', 'Validator Guide', 
                `<svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>`,
                'indigo', 
                showValidators
            ));

            if (apiData.enums && apiData.enums.length > 0) {
                nav.appendChild(createMenuItem('enums', 'Enum Types', 
                    `<svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>`,
                    'cyan', 
                    showEnums
                ));
            }

            nav.appendChild(createMenuItem('apis', 'API All',
                `<svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>`,
                'indigo',
                () => { if (!activeEndpointId || activeEndpointId === 'validators' || activeEndpointId === 'enums') activeEndpointId = null; }
            ));

            if (currentView !== 'apis') return;

            // --- API Modules ---
            const apiHeader = document.createElement('div');
            apiHeader.className = 'mt-8 mb-3 px-2 flex items-center justify-between border-t border-slate-800/30 pt-6';
            apiHeader.innerHTML = `
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">多配方功能</span>
                <div class="flex gap-3">
                   <button onclick="expandAll()" class="text-[9px] text-slate-500 hover:text-primary transition-colors">展开</button>
                   <button onclick="collapseAll()" class="text-[9px] text-slate-500 hover:text-primary transition-colors">折叠</button>
                </div>
            `;
            nav.appendChild(apiHeader);

            apiData.modules.forEach(mod => {
                const modFilter = mod.groups.some(group => 
                    group.endpoints.some(ep => ep.name.toLowerCase().includes(search) || ep.fullPath.toLowerCase().includes(search))
                );

                if (search && !modFilter) return;

                const modSection = document.createElement('div');
                modSection.className = 'mb-1';
                
                const isToggled = toggledModules.has(mod.name) || (search && modFilter);
                
                const header = document.createElement('button');
                header.className = 'w-full flex items-center justify-between px-3 py-2 text-[11px] font-bold text-slate-400/80 uppercase tracking-wider hover:text-white transition-colors group';
                header.onclick = () => toggleModule(mod.name);
                header.innerHTML = `
                    <div class="flex items-center gap-2">
                        <svg class="w-2.5 h-2.5 transition-transform ${isToggled ? 'rotate-90' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
                        <span>${mod.name}</span>
                    </div>
                `;
                modSection.appendChild(header);

                if (isToggled) {
                    mod.groups.forEach(group => {
                        const groupDiv = document.createElement('div');
                        groupDiv.className = 'mt-0.5 ml-2 space-y-px border-l border-slate-800/40';
                        
                        group.endpoints.forEach(ep => {
                            if (search && !ep.name.toLowerCase().includes(search) && !ep.fullPath.toLowerCase().includes(search)) return;

                            const epId = `${mod.name}.${group.name}.${ep.name}`;
                            const isActive = activeEndpointId === epId;

                            const btn = document.createElement('button');
                            btn.className = `w-full text-left px-4 py-1.5 rounded-md text-[12px] transition-all flex items-center gap-3 group ${isActive ? 'bg-indigo-500/10 text-indigo-400' : 'text-slate-500 hover:text-slate-300'}`;
                            btn.onclick = () => {
                                activeEndpointId = epId;
                                showEndpoint(mod.name, group.name, ep);
                                renderSidebar(search);
                            };
                            
                            const methodStyle = `method-${ep.method.toLowerCase()}`;
                            btn.innerHTML = `
                                <span class="text-[8px] font-black w-9 py-0.5 rounded-[3px] text-center uppercase opacity-80 ${methodStyle}">${ep.method}</span>
                                <span class="truncate flex-1 transition-all group-hover:translate-x-0.5 font-medium">${ep.name}</span>
                                ${ep.permission ? `<svg class="w-3.5 h-3.5 text-amber-500/70 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" title="Required Permission: ${ep.permission}"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>` : ''}
                            `;
                            groupDiv.appendChild(btn);
                        });
                        
                        if (groupDiv.children.length > 0) {
                            modSection.appendChild(groupDiv);
                        }
                    });
                }
                
                nav.appendChild(modSection);
            });
        }

        function toggleModule(name) {
            if (toggledModules.has(name)) toggledModules.delete(name);
            else toggledModules.add(name);
            renderSidebar(document.getElementById('api-search').value);
        }

        function expandAll() {
            apiData.modules.forEach(m => toggledModules.add(m.name));
            renderSidebar(document.getElementById('api-search').value);
        }

        function collapseAll() {
            toggledModules.clear();
            renderSidebar(document.getElementById('api-search').value);
        }

            const view = document.getElementById('content-view');
            let html = `

                            <tbody class="divide-y divide-white/5 cursor-default">

        function getFieldName(field, ctype) {
            if (!field) return '';
            if (field.tags && ctype) {
                if (field.tags[ctype]) return field.tags[ctype];
                const cleanCT = ctype.toLowerCase();
                if (field.tags[cleanCT]) return field.tags[cleanCT];
                if (cleanCT.includes('json') && field.tags['json']) return field.tags['json'];
                if (cleanCT.includes('xml') && field.tags['xml']) return field.tags['xml'];
                if ((cleanCT.includes('form') || cleanCT.includes('multipart')) && field.tags['form']) return field.tags['form'];
                if (cleanCT.includes('yaml') && field.tags['yaml']) return field.tags['yaml'];
                if (cleanCT.includes('toml') && field.tags['toml']) return field.tags['toml'];
            }
            return field.name || field.jsonName;
        }

        function renderParams(ep) {
            const tbody = document.getElementById('params-body');
            if (!tbody) return;
            let rows = '';

            const reqCT = ep.contentType || 'json';
            if (ep.inSealChain && ep.inSealChain.length > 0) {
                const sealName = ep.inSealChain[0];
                const model = apiData.models && apiData.models.find(m => m.name === sealName);
                if (ep.args) {
                    ep.args.forEach(arg => {
                        if (arg.source && arg.source.toLowerCase() !== 'body') {
                            rows += renderRow(arg, 0, false, '', null, null, new Set(), reqCT);
                        }
                    });
                }
                if (model) {
                    let discMap = {};
                    try { discMap = getDiscriminatorMap(model); } catch(e) {}
                    model.fields.forEach(f => {
                        let doc = f.doc || '';
                        rows += renderRow({
                            name: getFieldName(f, reqCT),
                            type: f.type,
                            source: 'Body',
                            validators: f.validators,
                            doc: doc,
                            isUnion: f.isUnion,
                            unionParamExp: f.unionParamExp,
                            isPayload: f.isPayload,
                            payloadArg: f.payloadArg
                        }, 0, false, '', discMap ? discMap[f.name] : null, discMap ? discMap['__field_' + f.name] : null, new Set(), reqCT, { payloadPlainType: ep.innerInputName });
                    });
                }
            } else if (!ep.isArgsWrapped && ep.inputName) {
                const model = apiData.models && apiData.models.find(m => m.name === ep.inputName);
                if (model) {
                    const defaultSource = (ep.args && ep.args[0]) ? ep.args[0].source : 'Body';
                    let discMap = {};
                    try { discMap = getDiscriminatorMap(model); } catch(e) {}
                    model.fields.forEach(f => {
                        rows += renderRow({
                            name: getFieldName(f, reqCT),
                            type: f.type,
                            source: defaultSource,
                            validators: f.validators,
                            doc: f.doc,
                            isUnion: f.isUnion,
                            unionParamExp: f.unionParamExp
                        }, 0, false, '', discMap ? discMap[f.name] : null, discMap ? discMap['__field_' + f.name] : null, new Set(), reqCT);
                    });
                }
            } else if (ep.args) {
                ep.args.forEach(arg => {
                    rows += renderRow(arg, 0, false, '', null, null, new Set(), reqCT);
                });
            }

            tbody.innerHTML = rows || '<tr><td colspan="5" class="p-8 text-center text-slate-600 italic">No parameters required</td></tr>';
        }

        function parseType(typeStr) {
            if (!typeStr) return { base: '', args: [] };
            let clean = typeStr.replace(/[*\[\]<>!]/g, '');
            let match = typeStr.match(/([a-zA-Z0-9_]+)[<\[](.*)[>\]]/);
            if (match) {
                return {
                    base: match[1],
                    args: match[2].split(',').map(s => s.trim()),
                    full: typeStr
                };
            }
            return { base: clean, args: [], full: typeStr };
        }

            const errorContainer = document.getElementById('resp-error-container');

            section.classList.remove('hidden');

            // Re-layout respGrid to act as a tab container if it has classes
            respGrid.className = "";

                        ${hasError ? `

                                succBtn.classList.add('text-slate-400', 'hover:text-slate-200');

                        " id="resp-err-btn" class="px-5 py-3 text-xs font-mono font-bold tracking-widest transition-all text-slate-400 hover:text-slate-200 flex items-center gap-2">

                            <table class="w-full text-left text-xs">

                                    ${(() => {
                                        const respBaseType = (ep.outSealChain && ep.outSealChain.length > 0) ? ep.outSealChain[0] : typeInfo.base;
                                        const respPayloadPlain = (ep.outSealChain && ep.outSealChain.length > 0) ? (ep.outPayloadDSL || ep.innerReturnType || '') : '';
                                        return renderTypeStructure(respBaseType, typeInfo, ep.responseContentType || 'application/json', respPayloadPlain);
                                    })()}

                                <tbody class="divide-y divide-white/5">
                                    ${ep.isErrorWrapped ? renderTypeStructure(ep.errorTypeBase, null, ep.errorContentType || ep.responseContentType || 'application/json') : 
                                        `<tr><td class="p-4 text-slate-500 italic">No specific structure, status code indicates error</td></tr>`
                                    }

        function formatDisplayType(rawType) {
            if (!rawType) return '';
            return rawType.replace(/^\*/, '').replace(/\*\[\]/g, '[]').replace(/\[\*([a-zA-Z0-9_]+)\]/g, '[$1]');
        }

        function renderTypeStructure(baseType, typeInfo, ctype = '', payloadPlainType = '') {
            const cleanBase = baseType ? baseType.replace(/[*[\]!]/g, '') : '';
            const model = apiData.models && apiData.models.find(m => m.name === cleanBase);
            const union = apiData.unions && apiData.unions.find(u => u.name === cleanBase);
            if (model) {
                let rows = '';
                let discMap = {};
                try { discMap = getDiscriminatorMap(model); } catch(e) {}
                const visited = new Set([cleanBase]);
                model.fields.forEach(f => {
                    let displayType = f.type;
                    if (typeInfo && model.typeParams && model.typeParams.length > 0) {
                        model.typeParams.forEach((param, idx) => {
                            const cleanFieldType = f.type.replace(/[*\[\]]/g, '');
                            if (cleanFieldType === param && typeInfo.args[idx]) {
                                displayType = f.type.replace(param, typeInfo.args[idx]);
                            }
                        });
                    }

                    let doc = f.doc || '';
                    rows += renderRow({
                        ...f,
                        doc: doc,
                        name: getFieldName(f, ctype),
                        type: displayType,
                    }, 0, true, '', discMap ? discMap[f.name] : null, discMap ? discMap['__field_' + f.name] : null, visited, ctype, { payloadPlainType: payloadPlainType });
                });
                return rows;
            } else if (union) {
                return renderRow({
                    name: '-',
                    type: baseType,
                    doc: 'Union type'
                }, 0, true, '', null, null, new Set(), ctype);
            } else {
                return renderRow({
                    name: '-',
                    type: baseType || 'Any',
                    doc: 'Direct return'
                }, 0, true, '', null, null, new Set(), ctype);
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.code-block').forEach(b => b.classList.add('hidden'));
            document.getElementById(`code-${tab}`).classList.remove('hidden');
            
            document.getElementById('tab-curl').classList.remove('tab-active');
            document.getElementById('tab-js').classList.remove('tab-active');
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
        }
        
        function getDiscriminatorMap(model) {
            const discriminatorMap = {};
            if (!model || !model.fields) return discriminatorMap;
            model.fields.forEach(f => {
                const cleanUnionType = f.type.split('(')[0].replace(/[*[\]!]/g, '');
                const u = apiData.unions && apiData.unions.find(x => x.name === cleanUnionType);
                if (u || f.isUnion) {
                    const foundUnion = u || (apiData.unions && apiData.unions.find(x => x.name === cleanUnionType));
                    if (foundUnion) {
                        const discField = model.fields.find(field => field.name === f.unionParamExp || field.type.replace(/[*[\]!]/g, '') === foundUnion.paramName || field.name === 'type');
                        const paramFieldName = discField ? discField.name : (f.unionParamExp || 'type');
                        
                        const uid = 'utab-' + Math.random().toString(36).substring(2, 7);
                        discriminatorMap[paramFieldName] = {
                            uid: uid,
                            union: foundUnion,
                            unionField: f
                        };
                        discriminatorMap['__field_' + f.name] = {
                            uid: uid,
                            union: foundUnion,
                            paramName: paramFieldName
                        };
                    }
                }
            });
            return discriminatorMap;
        }

        function generateMockValue(typeStr, fieldName = '') {
            if (!typeStr) return "example";
            const cleanType = typeStr.replace(/[*[\]!]/g, '');
            const lowerName = (fieldName || '').toLowerCase();
            
            const enm = apiData.enums && apiData.enums.find(e => e.name === cleanType);
            if (enm && enm.cases && enm.cases.length > 0) {
                const firstVal = enm.cases[0].value;
                return firstVal !== undefined ? firstVal : enm.cases[0].name;
            }

            const model = apiData.models && apiData.models.find(m => m.name === cleanType);
            if (model) {
                const obj = {};
                model.fields.forEach(f => {
                    const reqCT = 'json';
                    const fName = getFieldName(f, reqCT) || f.name;
                    if (f.isPayload) {
                        const payloadModelName = f.payloadArg && f.payloadArg !== 'T' ? f.payloadArg : '';
                        const pModel = payloadModelName ? apiData.models.find(m => m.name === payloadModelName) : null;
                        if (pModel) {
                            obj[fName] = JSON.stringify(generateMockValue(payloadModelName, fName));
                        } else {
                            obj[fName] = "payload_data";
                        }
                    } else {
                        obj[fName] = generateMockValue(f.type, fName);
                    }
                });
                return obj;
            }

            if (typeStr.includes('[]')) {
                const itemType = typeStr.replace('[]', '');
                return [generateMockValue(itemType, fieldName)];
            }

            const t = cleanType.toLowerCase();
            if (t === 'int' || t === 'integer' || t === 'int64' || t === 'number' || t === 'float') {
                if (lowerName.includes('age')) return 25;
                if (lowerName.includes('amount') || lowerName.includes('price')) return 100;
                if (lowerName.includes('status')) return 1;
                if (lowerName.includes('expire')) return 3600;
                return 1;
            }
            if (t === 'bool' || t === 'boolean') {
                return true;
            }
            if (t === 'string') {
                if (lowerName.includes('id')) return "1001";
                if (lowerName.includes('name')) return "example_name";
                if (lowerName.includes('login') || lowerName.includes('user')) return "admin";
                if (lowerName.includes('pass')) return "secret123";
                if (lowerName.includes('token')) return "token_xyz123";
                if (lowerName.includes('email')) return "user@example.com";
                if (lowerName.includes('phone') || lowerName.includes('mobile')) return "13800138000";
                if (lowerName.includes('url') || lowerName.includes('avatar')) return "https://example.com/avatar.png";
                if (lowerName.includes('kid')) return "v1";
                if (lowerName.includes('ver')) return "1.0";
                return "example";
            }
            return "example";
        }

        function buildSampleUrl(ep) {
            const baseUrl = (apiData.servers && apiData.servers[0] ? apiData.servers[0].url : (apiData.info && apiData.info.baseUrl || 'http://localhost:8080'));
            let fullPath = ep.fullPath || '';
            
            const pathArgs = (ep.args || []).filter(a => a.source && a.source.toLowerCase() === 'path');
            fullPath = fullPath.replace(/[:\{]([a-zA-Z0-9_]+)[\}]?/g, (match, paramName) => {
                const arg = pathArgs.find(a => a.name === paramName);
                const val = generateMockValue(arg ? arg.type : 'String', paramName);
                return String(val);
            });

            const queryParams = [];
            const reqCT = ep.contentType || 'json';
            if (!ep.isArgsWrapped && ep.inputName) {
                const model = apiData.models && apiData.models.find(m => m.name === ep.inputName);
                if (model) {
                    const source = (ep.args && ep.args[0]) ? ep.args[0].source : 'Body';
                    if (source === 'Query') {
                        model.fields.forEach(f => {
                            const fn = getFieldName(f, reqCT);
                            const val = generateMockValue(f.type, fn);
                            queryParams.push(`${fn}=${encodeURIComponent(val)}`);
                        });
                    }
                }
            } else if (ep.args) {
                ep.args.forEach(arg => {
                    if (arg.source && arg.source.toLowerCase() === 'query') {
                        const val = generateMockValue(arg.type, arg.name);
                        queryParams.push(`${arg.name}=${encodeURIComponent(val)}`);
                    }
                });
            }

            const qStr = queryParams.length > 0 ? '?' + queryParams.join('&') : '';
            return `${baseUrl}${fullPath}${qStr}`;
        }

        function buildSampleBody(ep) {
            const reqCT = ep.contentType || 'json';
            if (ep.inSealChain && ep.inSealChain.length > 0) {
                const sealName = ep.inSealChain[0];
                const sealModel = apiData.models && apiData.models.find(m => m.name === sealName);
                if (sealModel) {
                    return generateMockValue(sealName, '');
                }
            }

            if (ep.inputName) {
                const inputModel = apiData.models && apiData.models.find(m => m.name === ep.inputName);
                if (inputModel) {
                    return generateMockValue(ep.inputName, '');
                }
            }

            if (ep.args) {
                const bodyArgs = ep.args.filter(a => !a.source || a.source.toLowerCase() === 'body');
                if (bodyArgs.length > 0) {
                    const obj = {};
                    bodyArgs.forEach(a => {
                        obj[a.name] = generateMockValue(a.type, a.name);
                    });
                    return obj;
                }
            }

            return null;
        }

        function buildSampleHeaders(ep) {
            const headers = [];
            if (ep.method !== 'GET') {
                let ct = ep.contentType || 'application/json';
                if (ct === 'json') ct = 'application/json';
                else if (ct === 'form') ct = 'application/x-www-form-urlencoded';
                else if (ct === 'multipart') ct = 'multipart/form-data';
                headers.push({ name: 'Content-Type', value: ct });
            }
            if (ep.permission) {
                headers.push({ name: 'Authorization', value: 'Bearer <your_access_token>' });
            }
            if (ep.args) {
                ep.args.forEach(a => {
                    if (a.source && a.source.toLowerCase() === 'header') {
                        const val = generateMockValue(a.type, a.name);
                        headers.push({ name: a.name, value: String(val) });
                    }
                });
            }
            return headers;
        }

        function generateCurl(ep) {
            const url = buildSampleUrl(ep);
            let curl = `curl -X ${ep.method} "${url}"`;
            
            const headers = buildSampleHeaders(ep);
            if (ep.method === 'GET') {
                const getHeaders = headers.filter(h => h.name !== 'Content-Type');
                getHeaders.forEach(h => {
                    curl += ` \\\n  -H "${h.name}: ${h.value}"`;
                });
            } else {
                headers.forEach(h => {
                    curl += ` \\\n  -H "${h.name}: ${h.value}"`;
                });
                const body = buildSampleBody(ep);
                if (body) {
                    const jsonStr = JSON.stringify(body, null, 2);
                    curl += ` \\\n  -d '${jsonStr}'`;
                }
            }
            return curl;
        }

        function generateJS(ep) {
            const url = buildSampleUrl(ep);
            const headers = buildSampleHeaders(ep);
            const body = ep.method !== 'GET' ? buildSampleBody(ep) : null;
            
            let js = `fetch("${url}", {\n  method: "${ep.method}",\n`;
            
            const headerObj = {};
            if (ep.method === 'GET') {
                headers.filter(h => h.name !== 'Content-Type').forEach(h => { headerObj[h.name] = h.value; });
            } else {
                headers.forEach(h => { headerObj[h.name] = h.value; });
            }
            
            if (Object.keys(headerObj).length > 0) {
                js += `  headers: ${JSON.stringify(headerObj, null, 4).replace(/\n/g, '\n  ')},\n`;
            }
            
            if (body) {
                js += `  body: JSON.stringify(${JSON.stringify(body, null, 4).replace(/\n/g, '\n  ')})\n`;
            }
            
            js += `}).then(res => res.json())\n  .then(data => console.log(data));`;
            return js;
        }

        function renderRow(arg, depth = 0, hideSource = false, extraClass = '', discInfo = null, unionFieldInfo = null, visitedModels = new Set(), ctype = '', contextInfo = {}) {
            const padding = depth * 16;
            const isRequired = arg.validators && arg.validators.some(v => v.name === 'Required');
            const displayValidators = arg.validators ? arg.validators.filter(v => v.name !== 'Required') : [];
            const formattedType = formatDisplayType(arg.type);
            const displayType = (formattedType.endsWith('!') || !isRequired) ? formattedType : `${formattedType}!`;

            const cleanTypeForEnum = formattedType.replace(/[*[\]!]/g, '');
            const enm = apiData.enums && apiData.enums.find(e => e.name === cleanTypeForEnum);
            let enumHtml = '';
            if (enm) {
                enumHtml = `<div class="mt-1 flex flex-wrap gap-1 items-center">
                    <span class="text-[8px] font-black tracking-widest text-emerald-500/70 uppercase border border-emerald-500/20 px-1 rounded">Enum</span>
                    ${enm.cases.map(c => {
                        const val = (c.value !== undefined && c.value !== '') ? c.value : c.name;
                        const isStr = c.isString !== undefined ? c.isString : true;
                        return `<span class="text-[10px] font-mono bg-slate-800/80 text-emerald-100 px-1.5 py-0.5 rounded border border-slate-700" title="${c.doc || ''}">${isStr ? `'${val}'` : val}</span>`;
                    }).join('')}
                </div>`;
            }

            const cleanType = formattedType.split('(')[0].replace(/[*[\]!]/g, '');
            const isSelfRef = visitedModels && visitedModels.has(cleanType);
            const model = apiData.models && apiData.models.find(m => m.name === cleanType);
            const union = apiData.unions && apiData.unions.find(u => u.name === cleanType);

            let unionUid = unionFieldInfo ? unionFieldInfo.uid : null;
            let selectorHtml = '';
            if (union && (depth < 6)) {
                if (!unionUid) {
                    unionUid = 'utab-' + Math.random().toString(36).substring(2, 7);
                }
                selectorHtml = `<div class="mt-1 flex flex-wrap gap-1.5 items-center">
                    <span class="text-[8px] font-black tracking-widest text-indigo-400 uppercase border border-indigo-500/30 px-1 py-0.5 rounded bg-indigo-500/10">Selector</span>
                    ${union.cases.map((c, idx) => {
                        const val = (c.key !== undefined && c.key !== '') ? c.key : c.type;
                        return `<button onclick="
                            document.querySelectorAll('.${unionUid}-case').forEach(el => el.classList.add('hidden'));
                            document.querySelectorAll('.${unionUid}-btn').forEach(el => {
                                el.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-500', 'shadow-sm');
                                el.classList.add('bg-slate-800/80', 'text-indigo-200', 'border-slate-700', 'hover:border-indigo-500/50');
                            });
                            document.querySelectorAll('.${unionUid}-case-${idx}').forEach(el => el.classList.remove('hidden'));
                            this.classList.remove('bg-slate-800/80', 'text-indigo-200', 'border-slate-700', 'hover:border-indigo-500/50');
                            this.classList.add('bg-indigo-600', 'text-white', 'border-indigo-500', 'shadow-sm');
                        " class="${unionUid}-btn px-2 py-0.5 rounded border text-[10px] font-mono font-bold transition-all ${idx === 0 ? 'bg-indigo-600 text-white border-indigo-500 shadow-sm' : 'bg-slate-800/80 text-indigo-200 border-slate-700 hover:border-indigo-500/50'}" title="${c.doc || ''}">
                            '${val}'
                        </button>`;
                    }).join('')}
                </div>`;
            }

            let typeCellContent = displayType;
            if (enm) {
                typeCellContent = enumHtml;
            } else if (union && selectorHtml) {
                typeCellContent = selectorHtml;
            } else if (isSelfRef) {
                typeCellContent = `<span class="flex items-center gap-1.5 flex-wrap"><span>${displayType}</span><span class="text-[9px] font-mono font-semibold text-cyan-400/90 bg-cyan-500/10 border border-cyan-500/20 px-1.5 py-0.5 rounded tracking-wide">Self-ref Tree Node</span></span>`;
            }

            let docHtml = arg.doc || '';
            const targetPlain = (arg.payloadArg && arg.payloadArg !== 'T') ? arg.payloadArg : (contextInfo ? contextInfo.payloadPlainType : '');
            const cleanTargetPlain = targetPlain ? targetPlain.replace(/[*[\]!]/g, '') : '';
            const payloadModel = (arg.isPayload && cleanTargetPlain) ? (apiData.models && apiData.models.find(m => m.name === cleanTargetPlain)) : null;

            if (arg.isPayload && cleanTargetPlain) {
                let payloadCard = '';
                if (payloadModel) {
                    payloadCard = `
                        <div class="mt-2.5 p-3 rounded-xl bg-slate-900/90 border border-indigo-500/30 text-xs font-sans shadow-lg">
                            <div class="flex items-center gap-2 mb-2 pb-1.5 border-b border-white/5">
                                <span class="px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 font-mono font-bold text-[10px] border border-indigo-500/30">@payload(${cleanTargetPlain})</span>
                                <span class="text-slate-200 font-bold text-[11px]">解封载荷数据结构</span>
                            </div>
                            <div class="space-y-1 font-mono text-[11px]">
                                ${payloadModel.fields.map(pf => `
                                    <div class="flex items-center justify-between bg-slate-800/60 px-2.5 py-1 rounded border border-white/5">
                                        <div class="flex items-center gap-2">
                                            <span class="text-slate-200 font-semibold">${pf.name}</span>
                                            ${pf.doc ? `<span class="text-slate-400 italic text-[10px] truncate max-w-[160px]">${pf.doc}</span>` : ''}
                                        </div>
                                        <span class="text-indigo-400 font-bold ml-2">${pf.type}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="mt-2 text-[10px] text-slate-400 leading-normal">
                                💡 <b>提示：</b>本字段类型为 <code class="text-amber-300 font-mono">${formattedType}</code>，前端需将 <code class="text-indigo-300 font-mono">${cleanTargetPlain}</code> 结构转换成 <code class="text-amber-300 font-mono">${formattedType}</code> 给本字段（转换/加密方式按业务约定）。
                            </div>
                        </div>
                    `;
                } else {
                    payloadCard = `
                        <div class="mt-2 p-2.5 rounded-lg bg-slate-900/90 border border-indigo-500/30 text-xs font-sans">
                            <div class="flex items-center gap-2">
                                <span class="px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 font-mono font-bold text-[10px] border border-indigo-500/30">@payload(${cleanTargetPlain})</span>
                                <span class="text-slate-300 text-[11px]">解封载荷数据类型: <code class="text-indigo-300 font-mono">${cleanTargetPlain}</code></span>
                            </div>
                        </div>
                    `;
                }
                docHtml = docHtml ? `${docHtml}<br>${payloadCard}` : payloadCard;
            }

            let row = `
                <tr class="${extraClass} ${depth > 0 ? 'bg-white/[0.01]' : ''} group/row transition-colors hover:bg-white/[0.02]">
                    ${hideSource ? '' : `<td class="p-4 font-mono text-[9px] font-black uppercase text-slate-600">${arg.source || 'Body'}</td>`}
                    <td class="p-4 font-bold text-slate-300">
                        <div style="padding-left: ${padding}px" class="flex items-center gap-2">
                            ${depth > 0 ? '<svg class="w-3 h-3 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>' : ''}
                            <span class="text-slate-200">${arg.name}</span>
                        </div>
                    </td>
                    <td class="p-4 font-mono text-xs text-secondary/80">
                        ${typeCellContent}
                    </td>
                    ${hideSource ? '' : `<td class="p-4 whitespace-nowrap">${renderValidators(displayValidators)}</td>`}
                    <td class="p-4 text-xs text-slate-500 leading-relaxed max-w-xs">${docHtml || '-'}</td>
                </tr>
            `;

            // 如果是自引用结构，终止向内递归展开，避免死循环和多层重复展开
            if (isSelfRef) {
                return row;
            }

            const nextVisited = new Set(visitedModels || []);
            if (cleanType) {
                nextVisited.add(cleanType);
            }

            if (union && (depth < 6)) {
                const uid = unionUid;
                union.cases.forEach((c, idx) => {
                    const caseModel = apiData.models && apiData.models.find(m => m.name === c.type.replace(/[*[\]!]/g, ''));
                    if (caseModel) {
                        const caseDiscMap = getDiscriminatorMap(caseModel);
                        caseModel.fields.forEach(f => {
                            const cls = `${extraClass} ${uid}-case ${uid}-case-${idx} ${idx === 0 ? '' : 'hidden'}`;
                            const cDiscInfo = caseDiscMap[f.name];
                            const cUnionFieldInfo = caseDiscMap['__field_' + f.name];
                            row += renderRow({
                                name: getFieldName(f, ctype),
                                type: f.type,
                                source: arg.source || 'Body',
                                validators: f.validators,
                                doc: f.doc,
                                isUnion: f.isUnion,
                                unionParamExp: f.unionParamExp
                            }, depth + 1, hideSource, cls, cDiscInfo, cUnionFieldInfo, nextVisited, ctype, contextInfo);
                        });
                    }
                });
            } else if (model && (depth < 6)) { 
                const subDiscMap = getDiscriminatorMap(model);
                model.fields.forEach(f => {
                    const subDiscInfo = subDiscMap[f.name];
                    const subUnionFieldInfo = subDiscMap['__field_' + f.name];
                    row += renderRow({
                        name: getFieldName(f, ctype),
                        type: f.type,
                        source: arg.source || 'Body',
                        validators: f.validators,
                        doc: f.doc,
                        isUnion: f.isUnion,
                        unionParamExp: f.unionParamExp
                    }, depth + 1, hideSource, extraClass, subDiscInfo, subUnionFieldInfo, nextVisited, ctype, contextInfo);
                });
            }
            return row;
        }

        function renderValidators(validators) {
            if (!validators || validators.length === 0) return '<span class="text-slate-800">-</span>';
            return validators.map(v => {
                const argsTxt = (v.args && v.args.length > 0) 
                    ? `<span class="text-[10px] text-indigo-300/60 font-mono font-medium ml-1">(${v.args.map(a => a.value).join(', ')})</span>` 
                    : '';
                return `
                    <div class="inline-flex items-center px-2 py-0.5 rounded-md bg-indigo-500/10 border border-indigo-500/20 hover:bg-indigo-500/20 transition-all cursor-help group/badge mb-1 last:mb-0 mr-1" title="${v.doc || 'Validation rule'}">
                        <span class="text-[9px] font-black uppercase text-indigo-400 shadow-sm">${v.name}</span>
                        ${argsTxt}
                    </div>
                `;
            }).join('');
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-8 right-8 bg-indigo-600 text-white px-6 py-3 rounded-2xl shadow-2xl animate-in z-50 font-bold flex items-center gap-3';
                toast.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg> Copied to clipboard!`;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
