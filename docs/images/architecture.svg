<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 950" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- 卡片渐变 -->
    <linearGradient id="dslGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="docsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="50%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="adapterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#2d2b55" />
    </linearGradient>
    <linearGradient id="bizGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="respGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 箭头标记 -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#eab308" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #ffffff; }
    .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; }
    .node-code { font-family: "JetBrains Mono", Consolas, Menlo, monospace; font-size: 11px; fill: #38bdf8; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 800; }
  </style>

  <!-- 背景 -->
  <rect width="1120" height="950" rx="16" fill="url(#bgGradient)" />
  <rect x="1" y="1" width="1118" height="948" rx="15" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- 顶部标题栏 -->
  <text x="560" y="38" text-anchor="middle" class="title" font-size="22">🚀 Resgen 业务处理全景架构图 (Dual-Track Lifecycle)</text>
  <text x="560" y="60" text-anchor="middle" class="subtitle">契约单一事实源 · 代码与文档双轨自动化生成 · 强类型执行管道与零反射性能</text>

  <!-- ════════════════════ 0. DSL 契约源 (Single Source of Truth) ════════════════════ -->
  <g transform="translate(360, 78)">
    <rect width="400" height="48" rx="10" fill="url(#dslGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" fill-opacity="0.9" />
    <text x="200" y="24" text-anchor="middle" class="node-title" font-size="15">📄 Resgen DSL Schema (*.res) + resgen.yaml</text>
    <text x="200" y="40" text-anchor="middle" class="node-desc" font-size="11" fill="#dbeafe">唯一真理源：路由、模型、泛型 Wrap、校验规则、装饰器契约</text>
  </g>

  <!-- 编译分流指示 (resgen generate) -->
  <!-- 向左分流箭头 (代码生成) -->
  <path d="M 440 126 L 440 155 L 260 155 L 260 185" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="320" y="150" text-anchor="middle" class="node-code" font-size="11" fill="#a78bfa">⚡ resgen generate (代码轨)</text>

  <!-- 向右分流箭头 (文档生成) -->
  <path d="M 680 126 L 680 155 L 940 155 L 940 185" fill="none" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-gold)" />
  <text x="820" y="150" text-anchor="middle" class="node-code" font-size="11" fill="#fde047">🌟 自动提取 (文档轨)</text>

  <!-- ════════════════════ 🌟 右轨：全自动 API 文档与元数据系统 ════════════════════ -->
  <g transform="translate(800, 190)">
    <!-- 文档系统容器卡片 -->
    <rect width="280" height="690" rx="12" fill="#181308" fill-opacity="0.8" stroke="#ca8a04" stroke-width="2" filter="url(#goldGlow)" />
    <rect width="280" height="690" rx="12" fill="#1c1917" fill-opacity="0.5" stroke="#ca8a04" stroke-width="2" />
    
    <!-- 标题 -->
    <text x="140" y="30" text-anchor="middle" class="group-title" fill="#facc15" font-size="15">🌟 全自动 API 文档与交付</text>
    <text x="140" y="48" text-anchor="middle" class="node-desc" fill="#fef08a" font-size="11">Zero-Config API Delivery</text>

    <!-- 1. 自动提取与生成 -->
    <g transform="translate(15, 65)">
      <rect width="250" height="95" rx="8" fill="#292524" stroke="#eab308" stroke-width="1.5" />
      <text x="12" y="24" class="node-title" font-size="13" fill="#fde047">① 智能提取与产出</text>
      <text x="12" y="48" class="node-desc" fill="#e7e5e4">• 提取 DSL 字段与局部/单行注释</text>
      <text x="12" y="68" class="node-desc" fill="#e7e5e4">• 提取权限装饰器 (@auth Code)</text>
      <text x="12" y="88" class="node-desc" fill="#e7e5e4">• 输出 <tspan fill="#38bdf8">docs/api.json</tspan> &amp; <tspan fill="#38bdf8">api.html</tspan></text>
    </g>

    <!-- 箭头 -->
    <path d="M 140 160 L 140 185" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-gold)" />

    <!-- 2. 二进制内嵌 -->
    <g transform="translate(15, 190)">
      <rect width="250" height="95" rx="8" fill="#292524" stroke="#eab308" stroke-width="1.5" />
      <text x="12" y="24" class="node-title" font-size="13" fill="#fde047">② 零配置内嵌 (go:embed)</text>
      <text x="12" y="48" class="node-desc" fill="#e7e5e4">• 资源直接内嵌编译进二进制</text>
      <text x="12" y="68" class="node-desc" fill="#e7e5e4">• 无需外部 Web 静态服务器</text>
      <text x="12" y="88" class="node-desc" fill="#e7e5e4">• 单文件开箱即用、内网隔离可用</text>
    </g>

    <!-- 箭头 -->
    <path d="M 140 285 L 140 310" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-gold)" />

    <!-- 3. 内置路由自动挂载 -->
    <g transform="translate(15, 315)">
      <rect width="250" height="100" rx="8" fill="#292524" stroke="#eab308" stroke-width="1.5" />
      <text x="12" y="24" class="node-title" font-size="13" fill="#fde047">③ Engine 自动路由挂载</text>
      <text x="12" y="48" class="node-code" font-size="12" fill="#34d399">GET /docs</text>
      <text x="12" y="66" class="node-desc" fill="#cbd5e1">交互式 API 预览 (Tailwind CSS)</text>
      <text x="12" y="84" class="node-code" font-size="12" fill="#34d399">GET /docs/json</text>
    </g>

    <!-- 箭头 -->
    <path d="M 140 415 L 140 440" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-gold)" />

    <!-- 4. 高级交互体验 -->
    <g transform="translate(15, 445)">
      <rect width="250" height="120" rx="8" fill="#292524" stroke="#eab308" stroke-width="1.5" />
      <text x="12" y="24" class="node-title" font-size="13" fill="#fde047">④ 交互式文档体验</text>
      <text x="12" y="46" class="node-desc" fill="#e7e5e4">• 泛型深度还原 (ResData&lt;T&gt;)</text>
      <text x="12" y="66" class="node-desc" fill="#e7e5e4">• 权限标识一键高亮 (Badge)</text>
      <text x="12" y="86" class="node-desc" fill="#e7e5e4">• 自动生成 cURL / Fetch 请求</text>
      <text x="12" y="106" class="node-desc" fill="#e7e5e4">• 树形自引用递归防死锁保护</text>
    </g>

    <!-- 箭头 -->
    <path d="M 140 565 L 140 590" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-gold)" />

    <!-- 5. 最终受益者 -->
    <g transform="translate(15, 595)">
      <rect width="250" height="75" rx="8" fill="#422006" stroke="#ca8a04" stroke-width="2" />
      <text x="12" y="24" class="node-title" font-size="13" fill="#fef08a">👥 团队协作零时差交付</text>
      <text x="12" y="46" class="node-desc" fill="#fed7aa">• 前端开发人员 / 移动端</text>
      <text x="12" y="66" class="node-desc" fill="#fed7aa">• 测试人员 / 契约一致性保障</text>
    </g>
  </g>

  <!-- ════════════════════ 左轨：运行时请求执行体系 ════════════════════ -->

  <!-- 1. Client 客户端 -->
  <g transform="translate(140, 190)">
    <rect width="480" height="46" rx="23" fill="url(#clientGrad)" stroke="#38bdf8" stroke-width="2" />
    <text x="240" y="29" text-anchor="middle" class="node-title" font-size="14">🌐 Client / 前端 / 移动端 (HTTP Request)</text>
  </g>

  <!-- 箭头：Client -> Adapter -->
  <path d="M 380 236 L 380 262" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="390" y="252" class="node-desc" font-size="11" fill="#38bdf8">JSON / Form / Multipart / XML / Stream</text>

  <!-- 2. 框架适配层 (Adapter) -->
  <g transform="translate(80, 268)">
    <rect width="600" height="50" rx="10" fill="url(#adapterGrad)" stroke="#6366f1" stroke-width="1.5" />
    <text x="300" y="23" text-anchor="middle" class="node-title" fill="#e0e7ff">1. Web 框架适配层 (Adapter)</text>
    <text x="300" y="40" text-anchor="middle" class="node-desc" fill="#a5b4fc">GinContext / HttpContext 实现 ServerContextBase 契约 (Payload / RenderXXX / RenderStream)</text>
  </g>

  <!-- 3. 执行管道 (Executor Pipeline) -->
  <g transform="translate(30, 345)">
    <!-- 外边框 -->
    <rect width="700" height="235" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#6366f1" stroke-dasharray="6 4" stroke-width="1.5" />
    <text x="20" y="24" class="group-title" fill="#818cf8">2. Resgen 自动化执行管道 (Executor Pipeline - 编译期静态生成)</text>

    <!-- 步骤 1 -->
    <g transform="translate(15, 42)">
      <rect width="155" height="175" rx="8" fill="url(#stepGrad)" stroke="#8b5cf6" stroke-width="1.5" />
      <rect x="8" y="8" width="28" height="18" rx="4" fill="#6d28d9" />
      <text x="22" y="21" text-anchor="middle" class="badge" fill="#fff">①</text>
      <text x="42" y="22" class="node-title" font-size="12">Request Dec</text>
      <text x="10" y="55" class="node-desc" font-weight="bold" fill="#c4b5fd">请求切面拦截</text>
      <text x="10" y="78" class="node-desc">• 身份鉴权 (@auth)</text>
      <text x="10" y="98" class="node-desc">• 登录校验 (@login)</text>
      <text x="10" y="118" class="node-desc">• 频控与安全防御</text>
      <text x="10" y="150" class="node-code" font-size="10">e.d.Auth(ctx, info)</text>
    </g>

    <!-- 箭头 1 -> 2 -->
    <path d="M 170 130 L 185 130" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)" />

    <!-- 步骤 2 -->
    <g transform="translate(190, 42)">
      <rect width="155" height="175" rx="8" fill="url(#stepGrad)" stroke="#8b5cf6" stroke-width="1.5" />
      <rect x="8" y="8" width="28" height="18" rx="4" fill="#6d28d9" />
      <text x="22" y="21" text-anchor="middle" class="badge" fill="#fff">②</text>
      <text x="42" y="22" class="node-title" font-size="12">Binding Codec</text>
      <text x="10" y="55" class="node-desc" font-weight="bold" fill="#c4b5fd">参数绑定与解析</text>
      <text x="10" y="78" class="node-desc">• JSON / Form / XML</text>
      <text x="10" y="98" class="node-desc">• 多层点分嵌套绑定</text>
      <text x="10" y="118" class="node-desc">• 多态 Union 延迟解析</text>
      <text x="10" y="150" class="node-code" font-size="10">ResolveUnions()</text>
    </g>

    <!-- 箭头 2 -> 3 -->
    <path d="M 345 130 L 360 130" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)" />

    <!-- 步骤 3 -->
    <g transform="translate(365, 42)">
      <rect width="155" height="175" rx="8" fill="url(#stepGrad)" stroke="#8b5cf6" stroke-width="1.5" />
      <rect x="8" y="8" width="28" height="18" rx="4" fill="#6d28d9" />
      <text x="22" y="21" text-anchor="middle" class="badge" fill="#fff">③</text>
      <text x="42" y="22" class="node-title" font-size="12">Validation</text>
      <text x="10" y="55" class="node-desc" font-weight="bold" fill="#c4b5fd">强类型规则校验</text>
      <text x="10" y="78" class="node-desc">• 基础必填 (Required)</text>
      <text x="10" y="98" class="node-desc">• 文件规则 (@fileRule)</text>
      <text x="10" y="118" class="node-desc">• 跨字段关联 (LCA)</text>
      <text x="10" y="150" class="node-code" font-size="10">e.v.Required/Rules</text>
    </g>

    <!-- 箭头 3 -> 4 -->
    <path d="M 520 130 L 535 130" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)" />

    <!-- 步骤 4 -->
    <g transform="translate(540, 42)">
      <rect width="145" height="175" rx="8" fill="url(#stepGrad)" stroke="#8b5cf6" stroke-width="1.5" />
      <rect x="8" y="8" width="28" height="18" rx="4" fill="#6d28d9" />
      <text x="22" y="21" text-anchor="middle" class="badge" fill="#fff">④</text>
      <text x="42" y="22" class="node-title" font-size="12">Invoke Dec</text>
      <text x="10" y="55" class="node-desc" font-weight="bold" fill="#c4b5fd">调用前特化处理</text>
      <text x="10" y="78" class="node-desc">• 资源归属检查</text>
      <text x="10" y="98" class="node-desc">• 业务审计记录</text>
      <text x="10" y="118" class="node-desc">• 链路 Trace 注入</text>
      <text x="10" y="150" class="node-code" font-size="10">e.d.OwnerCheck()</text>
    </g>
  </g>

  <!-- 箭头：Pipeline -> BizHandler -->
  <path d="M 380 580 L 380 605" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="390" y="598" class="node-desc" font-size="11" fill="#34d399">强类型安全入参传入</text>

  <!-- 4. 业务逻辑核心 (开发人员核心切入点) -->
  <g transform="translate(30, 610)">
    <rect width="700" height="90" rx="12" fill="url(#bizGrad)" stroke="#10b981" stroke-width="2.5" filter="url(#glow)" fill-opacity="0.2" />
    <rect width="700" height="90" rx="12" fill="url(#bizGrad)" stroke="#10b981" stroke-width="2.5" />
    
    <text x="350" y="26" text-anchor="middle" class="node-title" font-size="16" fill="#6ee7b7">🌟 3. 业务逻辑核心 (开发人员 90% 日常核心切入点)</text>
    <text x="350" y="48" text-anchor="middle" class="node-desc" font-size="12" fill="#ecfdf5">纯粹 Go 业务代码 · 0 框架侵入 · 强类型入参 (input) &amp; 强类型出参 (Result / *LocalFileDownload)</text>
    <text x="350" y="70" text-anchor="middle" class="node-code" font-size="11" fill="#a7f3d0">func (h *UserHandler) CreateUser(ctx context.Context, input *resolver.CreateUserInput) (*resolver.User, error)</text>
  </g>

  <!-- 箭头：BizHandler -> Response Pipeline -->
  <path d="M 380 700 L 380 725" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)" />
  <text x="390" y="718" class="node-desc" font-size="11" fill="#38bdf8">返回强类型结果 / error</text>

  <!-- 5. 响应流水线与协议渲染 -->
  <g transform="translate(30, 730)">
    <rect width="700" height="110" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#0284c7" stroke-dasharray="6 4" stroke-width="1.5" />
    <text x="20" y="22" class="group-title" fill="#38bdf8">4. 响应流水线与协议渲染 (Response Pipeline &amp; Render)</text>

    <!-- 步骤 5 -->
    <g transform="translate(15, 32)">
      <rect width="210" height="65" rx="8" fill="url(#respGrad)" stroke="#0284c7" stroke-width="1.5" />
      <text x="12" y="24" class="node-title" font-size="12">⑤ Response Decorator</text>
      <text x="12" y="48" class="node-desc">结果脱敏 (MaskEmail) / 响应审计</text>
    </g>

    <!-- 箭头 5 -> 6 -->
    <path d="M 225 65 L 245 65" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />

    <!-- 步骤 6 -->
    <g transform="translate(250, 32)">
      <rect width="220" height="65" rx="8" fill="url(#respGrad)" stroke="#0284c7" stroke-width="1.5" />
      <text x="12" y="24" class="node-title" font-size="12">⑥ Standard Wrapping</text>
      <text x="12" y="48" class="node-desc">ResData / TreeRes / ListRes / wrap=none</text>
    </g>

    <!-- 箭头 6 -> 7 -->
    <path d="M 470 65 L 490 65" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />

    <!-- 步骤 7 -->
    <g transform="translate(495, 32)">
      <rect width="190" height="65" rx="8" fill="url(#respGrad)" stroke="#0284c7" stroke-width="1.5" />
      <text x="12" y="24" class="node-title" font-size="12">⑦ Protocol Render</text>
      <text x="12" y="48" class="node-desc">RenderJson / RenderStream</text>
    </g>
  </g>

  <!-- 异常快速拦截路径 -->
  <path d="M 30 435 C 5 435, 5 762, 245 762" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-red)" />
  <text x="12" y="600" class="node-desc" fill="#fb7185" font-size="10" transform="rotate(-90 12,600)">校验失败 / 鉴权拦截 / 异常快速退出 (Fast-Fail)</text>

  <!-- 底部完成指示 -->
  <text x="380" y="865" text-anchor="middle" class="node-desc" font-size="12" fill="#64748b">✔ HTTP 业务响应输出至 Client，全流程 0 反射损耗，强类型端到端闭环</text>
  <path d="M 380 840 L 380 850" stroke="#38bdf8" stroke-width="2" />
</svg>
