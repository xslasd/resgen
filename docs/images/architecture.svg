<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- 卡片渐变 -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="adapterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#2d2b55" />
    </linearGradient>
    <linearGradient id="bizGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="respGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 箭头标记 -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #ffffff; }
    .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; }
    .node-code { font-family: "JetBrains Mono", Consolas, Menlo, monospace; font-size: 11px; fill: #38bdf8; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 800; }
  </style>

  <!-- 背景 -->
  <rect width="1000" height="820" rx="16" fill="url(#bgGradient)" />
  <rect x="1" y="1" width="998" height="818" rx="15" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- 头部 Title -->
  <text x="500" y="42" text-anchor="middle" class="title" font-size="22">🚀 Resgen 业务处理全景架构图 (Execution Lifecycle)</text>
  <text x="500" y="65" text-anchor="middle" class="subtitle">自动化执行管道 · 契约与多协议解耦 · 开发人员零负担切入</text>

  <!-- ════════════════════ 1. Client 客户端 ════════════════════ -->
  <g transform="translate(300, 95)">
    <rect width="400" height="48" rx="24" fill="url(#clientGrad)" stroke="#38bdf8" stroke-width="2" />
    <text x="200" y="30" text-anchor="middle" class="node-title" font-size="15">🌐 Client / 前端 / 移动端 (HTTP Request)</text>
  </g>

  <!-- 箭头：Client -> Adapter -->
  <path d="M 500 143 L 500 170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="510" y="160" class="node-desc" font-size="11" fill="#38bdf8">JSON / Form / Multipart / XML</text>

  <!-- ════════════════════ 2. 框架适配层 (Adapter) ════════════════════ -->
  <g transform="translate(180, 175)">
    <rect width="640" height="52" rx="10" fill="url(#adapterGrad)" stroke="#6366f1" stroke-width="1.5" />
    <text x="320" y="25" text-anchor="middle" class="node-title" fill="#e0e7ff">1. Web 框架适配层 (Adapter)</text>
    <text x="320" y="42" text-anchor="middle" class="node-desc" fill="#a5b4fc">GinContext / HttpContext 实现 ServerContextBase 契约 (Payload / RenderXXX)</text>
  </g>

  <!-- ════════════════════ 3. 执行管道 (Executor Pipeline) ════════════════════ -->
  <g transform="translate(60, 255)">
    <!-- 外边框 -->
    <rect width="880" height="235" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#6366f1" stroke-dasharray="6 4" stroke-width="1.5" />
    <text x="20" y="24" class="group-title" fill="#818cf8">2. Resgen 自动化执行管道 (Executor Pipeline - 编译期静态代码生成)</text>

    <!-- 步骤 1 -->
    <g transform="translate(20, 42)">
      <rect width="195" height="175" rx="8" fill="url(#stepGrad)" stroke="#8b5cf6" stroke-width="1.5" />
      <rect x="10" y="10" width="32" height="18" rx="4" fill="#6d28d9" />
      <text x="26" y="23" text-anchor="middle" class="badge" fill="#fff">①</text>
      <text x="50" y="24" class="node-title" font-size="13">Request Decorator</text>
      <text x="15" y="55" class="node-desc" font-weight="bold" fill="#c4b5fd">全局与特化请求拦截</text>
      <text x="15" y="78" class="node-desc">• 身份鉴权 (@auth)</text>
      <text x="15" y="98" class="node-desc">• 登录校验 (@login)</text>
      <text x="15" y="118" class="node-desc">• 限流与安全防御</text>
      <text x="15" y="150" class="node-code">e.d.Auth(ctx, info)</text>
    </g>

    <!-- 箭头 1 -> 2 -->
    <path d="M 215 130 L 235 130" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)" />

    <!-- 步骤 2 -->
    <g transform="translate(240, 42)">
      <rect width="195" height="175" rx="8" fill="url(#stepGrad)" stroke="#8b5cf6" stroke-width="1.5" />
      <rect x="10" y="10" width="32" height="18" rx="4" fill="#6d28d9" />
      <text x="26" y="23" text-anchor="middle" class="badge" fill="#fff">②</text>
      <text x="50" y="24" class="node-title" font-size="13">Binding &amp; Codec</text>
      <text x="15" y="55" class="node-desc" font-weight="bold" fill="#c4b5fd">参数绑定与多态解析</text>
      <text x="15" y="78" class="node-desc">• JSON / XML / Form</text>
      <text x="15" y="98" class="node-desc">• 多层点分表单嵌套</text>
      <text x="15" y="118" class="node-desc">• 多态 Union 延迟解析</text>
      <text x="15" y="150" class="node-code">ResolveUnions()</text>
    </g>

    <!-- 箭头 2 -> 3 -->
    <path d="M 435 130 L 455 130" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)" />

    <!-- 步骤 3 -->
    <g transform="translate(460, 42)">
      <rect width="195" height="175" rx="8" fill="url(#stepGrad)" stroke="#8b5cf6" stroke-width="1.5" />
      <rect x="10" y="10" width="32" height="18" rx="4" fill="#6d28d9" />
      <text x="26" y="23" text-anchor="middle" class="badge" fill="#fff">③</text>
      <text x="50" y="24" class="node-title" font-size="13">Validation</text>
      <text x="15" y="55" class="node-desc" font-weight="bold" fill="#c4b5fd">强类型规则校验</text>
      <text x="15" y="78" class="node-desc">• 基础校验 (Required)</text>
      <text x="15" y="98" class="node-desc">• 文件规则 (@fileRule)</text>
      <text x="15" y="118" class="node-desc">• 跨字段关联 (LCA)</text>
      <text x="15" y="150" class="node-code">e.v.Required / FileRule</text>
    </g>

    <!-- 箭头 3 -> 4 -->
    <path d="M 655 130 L 675 130" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)" />

    <!-- 步骤 4 -->
    <g transform="translate(680, 42)">
      <rect width="180" height="175" rx="8" fill="url(#stepGrad)" stroke="#8b5cf6" stroke-width="1.5" />
      <rect x="10" y="10" width="32" height="18" rx="4" fill="#6d28d9" />
      <text x="26" y="23" text-anchor="middle" class="badge" fill="#fff">④</text>
      <text x="50" y="24" class="node-title" font-size="13">Invoke Decorator</text>
      <text x="15" y="55" class="node-desc" font-weight="bold" fill="#c4b5fd">调用前业务特化处理</text>
      <text x="15" y="78" class="node-desc">• 资源归属检查</text>
      <text x="15" y="98" class="node-desc">• 业务审计日志记录</text>
      <text x="15" y="118" class="node-desc">• 链路 Trace 注入</text>
      <text x="15" y="150" class="node-code">e.d.OwnerCheck(...)</text>
    </g>
  </g>

  <!-- 箭头：Pipeline -> BizHandler -->
  <path d="M 500 490 L 500 520" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="510" y="510" class="node-desc" font-size="11" fill="#34d399">强类型安全入参传入</text>

  <!-- ════════════════════ 4. 业务逻辑核心 (开发人员核心切入点) ════════════════════ -->
  <g transform="translate(140, 525)">
    <!-- 高亮发光背景框 -->
    <rect width="720" height="90" rx="14" fill="url(#bizGrad)" stroke="#10b981" stroke-width="2.5" filter="url(#glow)" fill-opacity="0.2" />
    <rect width="720" height="90" rx="14" fill="url(#bizGrad)" stroke="#10b981" stroke-width="2.5" />
    
    <text x="360" y="28" text-anchor="middle" class="node-title" font-size="17" fill="#6ee7b7">🌟 3. 业务逻辑核心 (开发人员 90% 日常核心切入点)</text>
    <text x="360" y="52" text-anchor="middle" class="node-desc" font-size="13" fill="#ecfdf5">纯粹 Go 业务代码 · 0 框架侵入 · 强类型入参 (input) &amp; 强类型出参 (Result / *LocalFileDownload)</text>
    <text x="360" y="74" text-anchor="middle" class="node-code" font-size="12" fill="#a7f3d0">func (h *UserHandler) CreateUser(ctx context.Context, input *resolver.CreateUserInput) (*resolver.User, error)</text>
  </g>

  <!-- 箭头：BizHandler -> Response Pipeline -->
  <path d="M 500 615 L 500 645" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)" />
  <text x="510" y="635" class="node-desc" font-size="11" fill="#38bdf8">返回强类型结果 / error</text>

  <!-- ════════════════════ 5. 响应流水线与渲染 ════════════════════ -->
  <g transform="translate(60, 650)">
    <rect width="880" height="110" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#0284c7" stroke-dasharray="6 4" stroke-width="1.5" />
    <text x="20" y="22" class="group-title" fill="#38bdf8">4. 响应流水线与协议渲染 (Response Pipeline &amp; Render)</text>

    <!-- 步骤 5 -->
    <g transform="translate(20, 32)">
      <rect width="265" height="65" rx="8" fill="url(#respGrad)" stroke="#0284c7" stroke-width="1.5" />
      <text x="15" y="25" class="node-title" font-size="13">⑤ Response Decorators</text>
      <text x="15" y="48" class="node-desc">结果脱敏 (MaskEmail) / 响应审计</text>
    </g>

    <!-- 箭头 5 -> 6 -->
    <path d="M 285 65 L 315 65" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />

    <!-- 步骤 6 -->
    <g transform="translate(320, 32)">
      <rect width="270" height="65" rx="8" fill="url(#respGrad)" stroke="#0284c7" stroke-width="1.5" />
      <text x="15" y="25" class="node-title" font-size="13">⑥ Standard Wrapping</text>
      <text x="15" y="48" class="node-desc">ResData / TreeRes / ListRes / wrap=none</text>
    </g>

    <!-- 箭头 6 -> 7 -->
    <path d="M 590 65 L 620 65" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />

    <!-- 步骤 7 -->
    <g transform="translate(625, 32)">
      <rect width="235" height="65" rx="8" fill="url(#respGrad)" stroke="#0284c7" stroke-width="1.5" />
      <text x="15" y="25" class="node-title" font-size="13">⑦ Protocol Render</text>
      <text x="15" y="48" class="node-desc">RenderJson / RenderXml / RenderStream</text>
    </g>
  </g>

  <!-- ════════════════════ 6. 异常快速拦截路径 ════════════════════ -->
  <path d="M 60 350 C 20 350, 20 682, 320 682" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-red)" />
  <text x="28" y="520" class="node-desc" fill="#fb7185" font-size="10" transform="rotate(-90 28,520)">校验失败 / 鉴权拦截 / 异常快速退出 (Fast-Fail)</text>

  <!-- 底部完成指示 -->
  <text x="500" y="795" text-anchor="middle" class="node-desc" font-size="12" fill="#64748b">✔ HTTP Response 输出至 Client，全流程 0 反射损耗，强类型端到端闭环</text>
</svg>
